<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/png" href="ninja.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap">
    <style>
        :root {
            --bg-light: #f0f4f8;
            --bg-dark: #0d1a2e;
            --container-light: #ffffff;
            --container-dark: #1a2b47;
            --card-light: #ffffff;
            --card-dark: #2a3f5f;
            --text-light-primary: #1e293b;
            --text-dark-primary: #e0e6f0;
            --text-light-secondary: #475569;
            --text-dark-secondary: #94a3b8;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --border-light: #e2e8f0;
            --border-dark: #3e4c6a;
        }
        html.dark {
            --bg-image: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1742&q=80');
        }
        html:not(.dark) {
            --bg-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1740&q=80');
        }

        body {
            background-image: var(--bg-image);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Roboto', sans-serif;
            transition: background-color 0.3s ease;
        }
        .bg-theme { background-color: var(--bg-light); }
        .dark .bg-theme { background-color: var(--bg-dark); }
        .bg-container { background-color: var(--container-light); }
        .dark .bg-container { background-color: var(--container-dark); }
        .bg-card { background-color: var(--card-light); }
        .dark .bg-card { background-color: var(--card-dark); }
        .text-primary { color: var(--text-light-primary); }
        .dark .text-primary { color: var(--text-dark-primary); }
        .text-secondary { color: var(--text-light-secondary); }
        .dark .text-secondary { color: var(--text-dark-secondary); }
        .border-theme { border-color: var(--border-light); }
        .dark .border-theme { border-color: var(--border-dark); }
        .accent { color: var(--accent-color); }

        .details {
            max-height: 0;
            transition: max-height 0.5s ease-out, padding 0.5s ease-out;
            padding-top: 0;
            padding-bottom: 0;
            overflow: hidden;
        }
        .card.open .details {
            max-height: 2000px;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .chevron {
            transition: transform 0.3s ease-in-out;
        }
        .card.open .chevron {
            transform: rotate(180deg);
        }
        .type-border-Military { border-left: 5px solid #ef4444; }
        .type-border-Primary { border-left: 5px solid #3b82f6; }
        .type-border-Magic { border-left: 5px solid #a855f7; }
        .type-border-Support { border-left: 5px solid #f97316; }
    </style>
</head>

                { "type": "Support", "name": "Banana Farm", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Banana Central", "crosspath": "5-2-0", "notes": "Generates income. Does not attack.", "canPopCamo": null, "canPopLead": null }, { "rank": 3, "name": "Monkey-Nomics", "crosspath": "2-5-0", "notes": "Generates income. Does not attack.", "canPopCamo": null, "canPopLead": null }, { "rank": 1, "name": "Monkey Wall Street", "crosspath": "0-2-5", "notes": "Generates income. Does not attack.", "canPopCamo": null, "canPopLead": null }] },
                { "type": "Support", "name": "Spike Factory", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Super Mines", "crosspath": "5-2-0", "notes": "5-2-0 provides a faster production rate. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Carpet of Spikes", "crosspath": "2-5-0", "notes": "2-5-0 provides a faster production rate. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 1, "name": "Perma-Spike", "crosspath": "0-2-5", "notes": "0-2-5 provides a much faster production rate. Needs external buffs for both Camo and Lead (e.g., MIB or 2-0-0 Alch).", "canPopCamo": false, "canPopLead": false }] },
                { "type": "Support", "name": "Engineer Monkey", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Sentry Champion", "crosspath": "5-2-0", "notes": "5-2-0 provides extra damage to MOABs. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Ultraboost", "crosspath": "0-5-2", "notes": "Crosspathing is not very impactful. 0-5-2 makes its foam slow bloons. Needs external camo and lead popping.", "canPopCamo": false, "canPopLead": false }, { "rank": 1, "name": "XXXL Trap", "crosspath": "2-0-5", "notes": "2-0-5 deploys traps much faster. Needs external camo detection to trap DDTs.", "canPopCamo": false, "canPopLead": true }] }
            ]
        };

        document.addEventListener('DOMContentLoaded', () => {
            const monkeyGrid = document.getElementById('monkey-grid');
            const filterContainer = document.getElementById('filter-container');
            const searchInput = document.getElementById('search-input');
            const sortSelect = document.getElementById('sort-select');
            const themeToggle = document.getElementById('theme-toggle');
            const themeIconLight = document.getElementById('theme-icon-light');
            const themeIconDark = document.getElementById('theme-icon-dark');

            const camoIcon = `<img src="camo.png" class="w-6 h-6 inline-block" title="Can pop Camo Bloons" alt="Camo Icon">`;
            const leadIcon = `<img src="lead.png" class="w-6 h-6 inline-block" title="Can pop Lead Bloons" alt="Lead Icon">`;

            const getIcon = (canPop, iconHtml) => canPop === true ? iconHtml : canPop === false ? `<div class="w-6 h-6 inline-block opacity-20">${iconHtml}</div>` : '';

            const renderMonkeys = () => {
                const filter = filterContainer.querySelector('.active').dataset.type;
                const searchTerm = searchInput.value.toLowerCase();
                const sortBy = sortSelect.value;

                monkeyGrid.innerHTML = '';

                let filteredMonkeys = crosspathData.monkeys
                    .filter(monkey => filter === 'all' || monkey.type === filter)
                    .filter(monkey => {
                        const monkeyNameMatch = monkey.name.toLowerCase().includes(searchTerm);
                        const upgradeNameMatch = monkey.upgrades.some(up => up.name.toLowerCase().includes(searchTerm));
                        return monkeyNameMatch || upgradeNameMatch;
                    });

                if (sortBy === 'name') {
                    filteredMonkeys.sort((a, b) => a.name.localeCompare(b.name));
                } else if (sortBy === 'rank') {
                    filteredMonkeys.sort((a, b) => {
                        const minRankA = Math.min(...a.upgrades.map(u => u.rank));
                        const minRankB = Math.min(...b.upgrades.map(u => u.rank));
                        return minRankA - minRankB;
                    });
                } else if (sortBy === 'type') {
                    filteredMonkeys.sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name));
                }

                if (filteredMonkeys.length === 0) {
                    monkeyGrid.innerHTML = `<p class="text-secondary italic col-span-full text-center py-10">No monkeys found. Try a different search or filter.</p>`;
                    return;
                }

                filteredMonkeys.forEach(monkey => {
                    const card = document.createElement('div');
                    card.className = `card bg-card shadow-lg rounded-lg border border-theme type-border-${monkey.type} transition-all duration-300`;

                    const sortedUpgrades = [...monkey.upgrades].sort((a, b) => a.rank - b.rank);

                    card.innerHTML = `
                        <div class="p-5 cursor-pointer header">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center gap-3">
                                    <h3 class="text-xl font-bold text-primary">${monkey.name}</h3>
                                    <div class="flex gap-1.5">
                                        ${getIcon(monkey.defaultCamo, camoIcon)}
                                        ${getIcon(monkey.defaultLead, leadIcon)}
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs font-bold text-secondary uppercase tracking-wider">${monkey.type}</span>
                                    <span class="chevron text-secondary">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="details px-5">
                            ${sortedUpgrades.map(upgrade => `
                                <div class="py-4 border-t border-theme">
                                    <div class="flex items-start gap-4">
                                        <div class="text-5xl font-black accent w-12 text-center opacity-50">#${upgrade.rank}</div>
                                        <div class="flex-1">
                                            <div class="flex justify-between items-start">
                                                <div>
                                                    <h4 class="text-lg font-semibold accent">${upgrade.name}</h4>
                                                    <p class="text-xs text-secondary font-medium uppercase tracking-wider mt-1">Best Crosspath</p>
                                                </div>
                                                <div class="flex flex-col items-center gap-1 text-center text-lg font-bold text-white bg-gray-700 dark:bg-gray-800 p-2 rounded-lg">
                                                    ${upgrade.crosspath.split('-').map((p, i) => `<span class="w-8 h-8 flex items-center justify-center rounded-md ${['bg-red-600', 'bg-blue-600', 'bg-green-600'][i]}">${p}</span>`).join('')}
                                                </div>
                                            </div>
                                            <div class="flex items-center mt-2 gap-1.5">
                                                ${getIcon(upgrade.canPopCamo, camoIcon)}
                                                ${getIcon(upgrade.canPopLead, leadIcon)}
                                            </div>
                                            <p class="text-sm text-secondary mt-3">${upgrade.notes || ''}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    monkeyGrid.appendChild(card);
                });

                document.querySelectorAll('.card .header').forEach(header => {
                    header.addEventListener('click', () => {
                        header.parentElement.classList.toggle('open');
                    });
                });
            };

            const applyTheme = (isDark) => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    themeIconLight.classList.add('hidden');
                    themeIconDark.classList.remove('hidden');
                } else {
                    document.documentElement.classList.remove('dark');
                    themeIconLight.classList.remove('hidden');
                    themeIconDark.classList.add('hidden');
                }
            };
            
            themeToggle.addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('btd6guide-theme', isDark ? 'dark' : 'light');
                applyTheme(isDark);
            });

            filterContainer.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    filterContainer.querySelectorAll('button').forEach(btn => {
                        btn.classList.remove('active', 'bg-accent-color', 'text-white');
                        btn.classList.add('text-secondary');
                    });
                    e.target.classList.add('active', 'bg-accent-color', 'text-white');
                    e.target.classList.remove('text-secondary');
                    renderMonkeys();
                }
            });

            searchInput.addEventListener('input', renderMonkeys);
            sortSelect.addEventListener('change', renderMonkeys);
            
            const savedTheme = localStorage.getItem('btd6guide-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(savedTheme === 'dark' || (savedTheme === null && prefersDark));

            renderMonkeys();
            
            // Style active button on load
            const activeButton = filterContainer.querySelector('.active');
            activeButton.classList.add('bg-accent-color', 'text-white');
            activeButton.classList.remove('text-secondary');
        });
    </script>
</body>
</html>
