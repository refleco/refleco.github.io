<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTD6 Interactive Crosspath Guide</title>
    <link rel="icon" type="image/png" href="ninja.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap">
</head>

<body
    class="transition-colors duration-300 bg-bg-light dark:bg-bg-dark text-text-light-primary dark:text-text-dark-primary overflow-x-hidden font-sans">
    <!-- Background Animation Canvas (Optional, reusing main one if desired, or just static bg) -->
    <div
        class="fixed inset-0 -z-10 bg-[url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1742&q=80')] bg-cover bg-center opacity-20 dark:opacity-40">
    </div>
    <div class="fixed inset-0 -z-10 bg-gradient-to-b from-transparent to-bg-light dark:to-bg-dark"></div>

    <div class="container mx-auto p-4 sm:p-6 lg:p-8 relative z-10">
        <div class="glass shadow-2xl rounded-3xl p-6 sm:p-10 border border-white/20 dark:border-slate-700">
            <header class="text-center mb-12 relative">
                <a href="../"
                    class="absolute left-0 top-0 text-slate-500 hover:text-accent transition-colors text-xl"><i
                        class="fas fa-arrow-left mr-2"></i>Back</a>
                <div class="flex justify-center items-center mb-6 gap-6 flex-wrap">
                    <img src="ninja.png" alt="BTD6 Ninja" class="w-20 h-20 drop-shadow-lg animate-bounce">
                    <h1
                        class="text-4xl md:text-6xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-cyan-400 dark:from-blue-400 dark:to-cyan-200">
                        BTD6 Crosspath Guide</h1>
                </div>
                <p class="text-xl text-slate-600 dark:text-slate-300 mt-2 max-w-3xl mx-auto font-light">The ultimate
                    interactive guide for Tier 5 crosspaths. Find the best upgrade paths and dominate every map.</p>
            </header>

            <div class="flex flex-col lg:flex-row gap-10">
                <aside class="w-full lg:w-1/4 lg:sticky top-8 self-start space-y-6">
                    <div
                        class="p-6 rounded-2xl bg-white/50 dark:bg-slate-800/50 shadow-lg border border-slate-200 dark:border-slate-700 backdrop-blur-sm">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Controls</h2>
                            <button id="theme-toggle"
                                class="w-10 h-10 rounded-full flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-accent bg-slate-200 dark:bg-slate-700 text-yellow-500 dark:text-blue-400 transition-transform hover:scale-110">
                                <i id="theme-icon-light" class="fas fa-sun"></i>
                                <i id="theme-icon-dark" class="fas fa-moon hidden"></i>
                            </button>
                        </div>
                        <div class="space-y-5">
                            <div class="relative">
                                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="search-input" placeholder="Search monkeys..."
                                    class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all shadow-sm">
                            </div>
                            <div>
                                <label for="sort-select"
                                    class="block text-sm font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wide">Sort
                                    by</label>
                                <div class="relative">
                                    <select id="sort-select"
                                        class="w-full pl-4 pr-10 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all shadow-sm appearance-none cursor-pointer">
                                        <option value="name">Name</option>
                                        <option value="rank">Best Path Rank</option>
                                        <option value="type">Type</option>
                                    </select>
                                    <i
                                        class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                                </div>
                            </div>
                        </div>
                        <div id="filter-container" class="grid grid-cols-2 lg:grid-cols-1 gap-3 mt-8">
                            <button
                                class="filter-btn p-3 rounded-xl font-semibold text-left transition-all duration-200 active"
                                data-type="all"><i class="fas fa-globe mr-2"></i> All Monkeys</button>
                            <button
                                class="filter-btn p-3 rounded-xl font-semibold text-left transition-all duration-200 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700"
                                data-type="Primary"><i class="fas fa-dart-crosshairs mr-2 text-blue-500"></i>
                                Primary</button>
                            <button
                                class="filter-btn p-3 rounded-xl font-semibold text-left transition-all duration-200 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700"
                                data-type="Military"><i class="fas fa-jet-fighter mr-2 text-green-600"></i>
                                Military</button>
                            <button
                                class="filter-btn p-3 rounded-xl font-semibold text-left transition-all duration-200 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700"
                                data-type="Magic"><i class="fas fa-hat-wizard mr-2 text-purple-500"></i> Magic</button>
                            <button
                                class="filter-btn p-3 rounded-xl font-semibold text-left transition-all duration-200 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700"
                                data-type="Support"><i class="fas fa-house-medical mr-2 text-orange-500"></i>
                                Support</button>
                        </div>
                    </div>
                </aside>

                <main id="monkey-grid" class="w-full lg:w-3/4 grid grid-cols-1 md:grid-cols-2 gap-8 content-start">
                    <!-- Cards injected by JS -->
                </main>
            </div>
        </div>

        <footer class="text-center mt-12 text-slate-500 dark:text-slate-400 text-sm">
            &copy; 2025 Justin Wu. Unofficial BTD6 Guide.
        </footer>
    </div>

    <script type="module" src="/src/btd6.js"></script>
</body>

</html>
