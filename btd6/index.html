<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTD6 Interactive Crosspath Guide</title>
    <link rel="icon" type="image/png" href="ninja.png">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'accent-color': 'var(--accent-color)',
                        'accent-hover': 'var(--accent-hover)',
                        'light-primary': 'var(--text-light-primary)',
                        'dark-primary': 'var(--text-dark-primary)',
                        'light-secondary': 'var(--text-light-secondary)',
                        'dark-secondary': 'var(--text-dark-secondary)',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="transition-colors duration-300">
    <!-- Loading Screen -->
    <div id="loader">
        <div class="loader-content"></div>
    </div>

    <!-- Background Canvas -->
    <canvas id="starfield"></canvas>

    <div class="container mx-auto p-4 sm:p-6 lg:p-8 relative z-10">
        <div class="btd6-container shadow-2xl rounded-3xl p-4 sm:p-8">
            <header class="text-center mb-10 reveal">
                <div class="flex justify-center items-center mb-4 gap-4">
                    <img src="ninja.png" alt="BTD6 Ninja" class="w-20 h-20 drop-shadow-lg animate-bounce-slow">
                    <h1 class="text-4xl md:text-6xl font-black tracking-tighter">BTD6 Crosspath Guide</h1>
                </div>
                <p class="text-xl text-light-secondary dark:text-dark-secondary mt-2 max-w-3xl mx-auto">The ultimate
                    interactive guide for Tier 5 crosspaths in Bloons TD 6. Find the best upgrade paths and dominate
                    every map.</p>
                <div class="mt-6">
                    <a href="../" class="text-accent-color hover:text-accent-hover font-bold transition-colors"><i
                            class="fas fa-arrow-left mr-2"></i>Back to Portfolio</a>
                </div>
            </header>

            <div class="flex flex-col lg:flex-row gap-8">
                <aside class="w-full lg:w-1/4 lg:sticky top-8 self-start reveal">
                    <div class="p-6 rounded-2xl bg-card shadow-lg border border-theme">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold">Controls</h2>
                        </div>
                        <div class="space-y-4">
                            <input type="text" id="search-input" placeholder="Search monkeys..."
                                class="w-full p-3 rounded-xl border border-accent-color bg-white dark:bg-slate-800 text-gray-900 dark:text-dark-primary focus:ring-2 focus:ring-accent-color focus:outline-none transition">
                            <div>
                                <label for="sort-select"
                                    class="block text-sm font-medium text-gray-900 dark:text-dark-secondary mb-1">Sort
                                    by</label>
                                <select id="sort-select"
                                    class="w-full p-3 rounded-xl border border-accent-color bg-white dark:bg-slate-800 text-gray-900 dark:text-dark-primary focus:ring-2 focus:ring-accent-color focus:outline-none transition">
                                    <option value="name">Name</option>
                                    <option value="rank">Best Path Rank</option>
                                    <option value="type">Type</option>
                                </select>
                            </div>
                        </div>
                        <div id="filter-container" class="grid grid-cols-2 lg:grid-cols-1 gap-2 mt-6">
                            <button
                                class="filter-btn p-3 rounded-xl font-semibold text-gray-900 dark:text-dark-secondary active text-left hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors"
                                data-type="all">All Monkeys</button>
                            <button
                                class="filter-btn p-3 rounded-xl font-semibold text-light-secondary dark:text-dark-secondary text-left hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors"
                                data-type="Primary">Primary</button>
                            <button
                                class="filter-btn p-3 rounded-xl font-semibold text-light-secondary dark:text-dark-secondary text-left hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors"
                                data-type="Military">Military</button>
                            <button
                                class="filter-btn p-3 rounded-xl font-semibold text-light-secondary dark:text-dark-secondary text-left hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors"
                                data-type="Magic">Magic</button>
                            <button
                                class="filter-btn p-3 rounded-xl font-semibold text-light-secondary dark:text-dark-secondary text-left hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors"
                                data-type="Support">Support</button>
                        </div>
                    </div>
                </aside>

                <main id="monkey-grid" class="w-full lg:w-3/4 grid grid-cols-1 md:grid-cols-2 gap-6 reveal items-start">
                </main>
            </div>
        </div>
    </div>

    <button id="theme-toggle"
        class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-card shadow-lg flex items-center justify-center text-2xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-color border border-theme transition-transform duration-300 hover:scale-110 z-50">
        <i id="theme-icon-light" class="fas fa-sun text-yellow-500"></i>
        <i id="theme-icon-dark" class="fas fa-moon text-blue-300 hidden"></i>
    </button>

    <script src="../script.js"></script>
    <script src="btd6.js"></script>
</body>

</html>
