<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTD6 Interactive Crosspath Guide</title>
    <link rel="icon" type="image/png" href="ninja.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'accent-color': 'var(--accent-color)',
                        'accent-hover': 'var(--accent-hover)',
                        'light-primary': 'var(--text-light-primary)',
                        'dark-primary': 'var(--text-dark-primary)',
                        'light-secondary': 'var(--text-light-secondary)',
                        'dark-secondary': 'var(--text-dark-secondary)',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* BTD6 Specific Styles */
        .details {
            max-height: 0;
            transition: max-height 0.5s ease-out, padding 0.5s ease-out;
            padding-top: 0;
            padding-bottom: 0;
            overflow: hidden;
        }

        .card.open .details {
            max-height: 2000px;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        .chevron {
            transition: transform 0.3s ease-in-out;
        }

        .card.open .chevron {
            transform: rotate(180deg);
        }

        .type-border-Military {
            border-left: 5px solid #ef4444;
        }

        .type-border-Primary {
            border-left: 5px solid #3b82f6;
        }

        .type-border-Magic {
            border-left: 5px solid #a855f7;
        }

        .type-border-Support {
            border-left: 5px solid #f97316;
        }

        /* Override main container for this specific layout if needed */
        .btd6-container {
            background-color: var(--container-light);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dark .btd6-container {
            background-color: var(--container-dark);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="transition-colors duration-300">

                                data-type="Support">Support</button>

                    </div>
                </aside>

            </div>

                { "type": "Support", "name": "Monkey Village", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Primary Expertise", "crosspath": "5-2-0", "notes": "5-2-0 provides a primary training buff. Does not attack.", "canPopCamo": null, "canPopLead": null }, { "rank": 1, "name": "Homeland Defense", "crosspath": "2-5-0", "notes": "2-5-0 provides a larger radius for its powerful global ability. Does not attack.", "canPopCamo": null, "canPopLead": null }, { "rank": 3, "name": "Monkeyopolis", "crosspath": "0-2-5", "notes": "Generates income. Does not attack.", "canPopCamo": null, "canPopLead": null }] },
                { "type": "Support", "name": "Banana Farm", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Banana Central", "crosspath": "5-2-0", "notes": "Generates income. Does not attack.", "canPopCamo": null, "canPopLead": null }, { "rank": 3, "name": "Monkey-Nomics", "crosspath": "2-5-0", "notes": "Generates income. Does not attack.", "canPopCamo": null, "canPopLead": null }, { "rank": 1, "name": "Monkey Wall Street", "crosspath": "0-2-5", "notes": "Generates income. Does not attack.", "canPopCamo": null, "canPopLead": null }] },
                { "type": "Support", "name": "Spike Factory", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Super Mines", "crosspath": "5-2-0", "notes": "5-2-0 provides a faster production rate. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Carpet of Spikes", "crosspath": "2-5-0", "notes": "2-5-0 provides a faster production rate. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 1, "name": "Perma-Spike", "crosspath": "0-2-5", "notes": "0-2-5 provides a much faster production rate. Needs external buffs for both Camo and Lead (e.g., MIB or 2-0-0 Alch).", "canPopCamo": false, "canPopLead": false }] },
                { "type": "Support", "name": "Engineer Monkey", "defaultCamo": false, "defaultLead": false, "upgrades": [{ "rank": 2, "name": "Sentry Champion", "crosspath": "5-2-0", "notes": "5-2-0 provides extra damage to MOABs. Needs external camo detection.", "canPopCamo": false, "canPopLead": true }, { "rank": 3, "name": "Ultraboost", "crosspath": "0-5-2", "notes": "Crosspathing is not very impactful. 0-5-2 makes its foam slow bloons. Needs external camo and lead popping.", "canPopCamo": false, "canPopLead": false }, { "rank": 1, "name": "XXXL Trap", "crosspath": "2-0-5", "notes": "2-0-5 deploys traps much faster. Needs external camo detection to trap DDTs.", "canPopCamo": false, "canPopLead": true }] }
            ]
        };

        document.addEventListener('DOMContentLoaded', () => {
            const monkeyGrid = document.getElementById('monkey-grid');
            const filterContainer = document.getElementById('filter-container');
            const searchInput = document.getElementById('search-input');
            const sortSelect = document.getElementById('sort-select');

            // Note: Theme toggle logic is now handled by the global script.js
            // We just need to make sure the UI reflects the state if needed, but script.js does that too.

            const camoIcon = `<img src="camo.png" class="w-6 h-6 inline-block" title="Can pop Camo Bloons" alt="Camo Icon">`;
            const leadIcon = `<img src="lead.png" class="w-6 h-6 inline-block" title="Can pop Lead Bloons" alt="Lead Icon">`;

            const getIcon = (canPop, iconHtml) => canPop === true ? iconHtml : canPop === false ? `<div class="w-6 h-6 inline-block opacity-20 grayscale">${iconHtml}</div>` : '';

            const renderMonkeys = () => {
                const filter = filterContainer.querySelector('.active').dataset.type;
                const searchTerm = searchInput.value.toLowerCase();
                const sortBy = sortSelect.value;

                monkeyGrid.innerHTML = '';

                let filteredMonkeys = crosspathData.monkeys
                    .filter(monkey => filter === 'all' || monkey.type === filter)
                    .filter(monkey => {
                        const monkeyNameMatch = monkey.name.toLowerCase().includes(searchTerm);
                        const upgradeNameMatch = monkey.upgrades.some(up => up.name.toLowerCase().includes(searchTerm));
                        return monkeyNameMatch || upgradeNameMatch;
                    });

                if (sortBy === 'name') {
                    filteredMonkeys.sort((a, b) => a.name.localeCompare(b.name));
                } else if (sortBy === 'rank') {
                    filteredMonkeys.sort((a, b) => {
                        const minRankA = Math.min(...a.upgrades.map(u => u.rank));
                        const minRankB = Math.min(...b.upgrades.map(u => u.rank));
                        return minRankA - minRankB;
                    });
                } else if (sortBy === 'type') {
                    filteredMonkeys.sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name));
                }

                if (filteredMonkeys.length === 0) {
                    monkeyGrid.innerHTML = `<p class="text-light-secondary dark:text-dark-secondary italic col-span-full text-center py-10">No monkeys found. Try a different search or filter.</p>`;
                    return;
                }

                filteredMonkeys.forEach(monkey => {
                    const card = document.createElement('div');
                    // Added tilt-card class for 3D effect
                    card.className = `card tilt-card bg-card shadow-lg rounded-2xl border border-theme type-border-${monkey.type} transition-all duration-300 overflow-hidden`;

                    const sortedUpgrades = [...monkey.upgrades].sort((a, b) => a.rank - b.rank);

                    card.innerHTML = `
                        <div class="p-6 cursor-pointer header hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center gap-4">
                                    <h3 class="text-2xl font-bold text-light-primary dark:text-dark-primary">${monkey.name}</h3>
                                    <div class="flex gap-2">
                                        ${getIcon(monkey.defaultCamo, camoIcon)}
                                        ${getIcon(monkey.defaultLead, leadIcon)}
                                    </div>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs font-bold text-light-secondary dark:text-dark-secondary uppercase tracking-wider border border-theme px-2 py-1 rounded-md">${monkey.type}</span>
                                    <span class="chevron text-light-secondary dark:text-dark-secondary">
                                        <i class="fas fa-chevron-down text-xl"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="details px-6 bg-gray-50 dark:bg-slate-800/50">
                            ${sortedUpgrades.map(upgrade => `
                                <div class="py-5 border-t border-theme first:border-t-0">
                                    <div class="flex items-start gap-5">
                                        <div class="text-5xl font-black text-accent-color w-12 text-center opacity-40">#${upgrade.rank}</div>
                                        <div class="flex-1">
                                            <div class="flex justify-between items-start mb-2">
                                                <div>
                                                    <h4 class="text-xl font-bold text-accent-color">${upgrade.name}</h4>
                                                    <p class="text-xs text-light-secondary dark:text-dark-secondary font-bold uppercase tracking-wider mt-1">Best Crosspath</p>
                                                </div>
                                                <div class="flex flex-col items-center gap-1 text-center text-lg font-bold text-white bg-slate-700 dark:bg-slate-900 p-2 rounded-lg shadow-inner">
                                                    ${upgrade.crosspath.split('-').map((p, i) => `<span class="w-8 h-8 flex items-center justify-center rounded-md ${['bg-red-500', 'bg-blue-500', 'bg-green-500'][i]} shadow-sm">${p}</span>`).join('')}
                                                </div>
                                            </div>
                                            <div class="flex items-center mt-2 gap-2 mb-3">
                                                ${getIcon(upgrade.canPopCamo, camoIcon)}
                                                ${getIcon(upgrade.canPopLead, leadIcon)}
                                            </div>
                                            <p class="text-md text-light-secondary dark:text-dark-secondary leading-relaxed">${upgrade.notes || ''}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    monkeyGrid.appendChild(card);
                });

                document.querySelectorAll('.card .header').forEach(header => {
                    header.addEventListener('click', (e) => {
                        // Prevent tilt effect from interfering with click if needed, but usually fine
                        header.parentElement.classList.toggle('open');
                    });
                });

                // Re-initialize tilt effect for new cards
                if (window.initTiltEffect) window.initTiltEffect();
            };

            filterContainer.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    filterContainer.querySelectorAll('button').forEach(btn => {
                        btn.classList.remove('active', 'bg-accent-color', 'text-white');
                        btn.classList.add('text-light-secondary', 'dark:text-dark-secondary');
                    });
                    e.target.classList.add('active', 'bg-accent-color', 'text-white');
                    e.target.classList.remove('text-light-secondary', 'dark:text-dark-secondary');
                    renderMonkeys();
                }
            });

            searchInput.addEventListener('input', renderMonkeys);
            sortSelect.addEventListener('change', renderMonkeys);

            // Initial render
            renderMonkeys();

            // Style active button on load
            const activeButton = filterContainer.querySelector('.active');
            if (activeButton) {
                activeButton.classList.add('bg-accent-color', 'text-white');
                activeButton.classList.remove('text-light-secondary', 'dark:text-dark-secondary');
            }
        });
    </script>
</body>

</html>
