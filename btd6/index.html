            --accent-color: #3498db;
            --accent-hover: #5dade2;
            --border-color: rgba(52, 152, 219, 0.3);
            --shadow-color: rgba(0, 0, 0, 0.5);
        }
        body {
            background-image: var(--bg-image);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Roboto', sans-serif;
            color: var(--text-primary);
        }
        .main-container {
            background-color: var(--container-bg);
            box-shadow: 0 0 25px var(--shadow-color);
            border-radius: 12px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px var(--shadow-color);
            transition: all 0.3s ease-in-out;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.7);
        }
        .filter-btn {
            transition: all 0.2s ease-in-out;
            background-color: rgba(52, 152, 219, 0.2);
        }
        .filter-btn:hover {
            background-color: rgba(52, 152, 219, 0.4);
        }
        .filter-btn.active {
            background-color: var(--accent-color);
            color: white;
            font-weight: 600;
        }
        .details {
            max-height: 0;
            transition: max-height 0.5s ease-in-out, padding 0.5s ease-in-out;
            padding-top: 0;
            padding-bottom: 0;
        }
        .card.open .details {
            max-height: 1500px; /* Increased max-height */
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .chevron {
            transition: transform 0.3s ease-in-out;
        }
        .card.open .chevron {
            transform: rotate(180deg);
        }
        .type-border-Military { border-top: 4px solid #4a5568; }
        .type-border-Primary { border-top: 4px solid #c53030; }
        .type-border-Magic { border-top: 4px solid #805ad5; }
        .type-border-Support { border-top: 4px solid #dd6b20; }

                {
                    "type": "Support", "name": "Engineer Monkey", "defaultCamo": false, "defaultLead": false, "upgrades": [
                        { "rank": 2, "name": "Sentry Champion", "crosspath": "5-2-0", "notes": "5-2-0 provides extra damage to MOABs. Needs external camo detection.", "canPopCamo": false, "canPopLead": true },
                        { "rank": 3, "name": "Ultraboost", "crosspath": "0-5-2", "notes": "Crosspathing is not very impactful. 0-5-2 makes its foam slow bloons. Needs external camo and lead popping.", "canPopCamo": false, "canPopLead": false },
                        { "rank": 1, "name": "XXXL Trap", "crosspath": "2-0-5", "notes": "2-0-5 deploys traps much faster. Needs external camo detection to trap DDTs.", "canPopCamo": false, "canPopLead": true }
                    ]
                }
            ]
        };

        const monkeyGrid = document.getElementById('monkey-grid');
        const filterContainer = document.getElementById('filter-container');
        const searchInput = document.getElementById('search-input');

        const renderMonkeys = (filter = 'all', searchTerm = '') => {
            monkeyGrid.innerHTML = '';
            
            let typeFilteredMonkeys = filter === 'all' 
                ? crosspathData.monkeys 
                : crosspathData.monkeys.filter(monkey => monkey.type === filter);

            const lowerCaseSearchTerm = searchTerm.toLowerCase();
            
            let searchFilteredMonkeys = typeFilteredMonkeys.filter(monkey => {
                const monkeyNameMatch = monkey.name.toLowerCase().includes(lowerCaseSearchTerm);
                const upgradeNameMatch = monkey.upgrades.some(upgrade => upgrade.name.toLowerCase().includes(lowerCaseSearchTerm));
                return monkeyNameMatch || upgradeNameMatch;
            });

            searchFilteredMonkeys.sort((a, b) => a.name.localeCompare(b.name));

            if (searchFilteredMonkeys.length === 0) {
                monkeyGrid.innerHTML = `<p class="text-gray-400 italic col-span-1 xl:col-span-2 text-center">No monkeys found. Try a different search or filter.</p>`;
            } else {
                searchFilteredMonkeys.forEach(monkey => {
                    const card = document.createElement('div');
                    card.className = `card type-border-${monkey.type}`;
                    
                    const defaultCamoIconHtml = monkey.defaultCamo ? camoIcon : '';
                    const defaultLeadIconHtml = monkey.defaultLead ? leadIcon : '';

                    const cardHeader = document.createElement('div');
                    cardHeader.className = 'p-5 cursor-pointer';
                    cardHeader.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <h3 class="text-xl font-bold text-white">${monkey.name}</h3>
                                ${defaultCamoIconHtml}
                                ${defaultLeadIconHtml}
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">${monkey.type}</span>
                                <span class="chevron text-gray-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                    </svg>
                                </span>
                            </div>
                        </div>
                    `;

                    const detailsContainer = document.createElement('div');
                    detailsContainer.className = 'details px-5';
                    
                    const sortedUpgrades = monkey.upgrades.sort((a, b) => a.rank - b.rank);

                    detailsContainer.innerHTML = `
                        ${sortedUpgrades.map((upgrade) => {
                            const paths = upgrade.crosspath.split('-');
                            const pathColors = ['bg-red-600', 'bg-blue-600', 'bg-green-600'];
                            
                            const camoIconHtml = upgrade.canPopCamo === true ? camoIcon : '';
                            const leadIconHtml = upgrade.canPopLead === true ? leadIcon : '';

                            return `
                            <div class="py-4 border-t border-gray-700">
                                <div class="flex items-start gap-4">
                                    <div class="text-4xl font-bold text-gray-600 w-10 text-center">#${upgrade.rank}</div>
                                    <div class="flex-1">
                                        <div class="flex justify-between items-start">
                                            <div>
                                                <div class="flex items-center">
                                                    <h4 class="text-lg font-semibold" style="color: var(--accent-color);">${upgrade.name}</h4>
                                                    <div class="flex items-center ml-2 gap-1.5">
                                                        ${camoIconHtml}
                                                        ${leadIconHtml}
                                                    </div>
                                                </div>
                                                <p class="text-xs text-gray-400 font-medium uppercase tracking-wider">Best Crosspath</p>
                                            </div>
                                            <div class="flex flex-col items-center gap-1 text-center text-lg font-bold text-white">
                                                <span class="w-8 h-8 flex items-center justify-center rounded-md ${pathColors[0]}">${paths[0]}</span>
                                                <span class="w-8 h-8 flex items-center justify-center rounded-md ${pathColors[1]}">${paths[1]}</span>
                                                <span class="w-8 h-8 flex items-center justify-center rounded-md ${pathColors[2]}">${paths[2]}</span>
                                            </div>
                                        </div>
                                        <p class="text-sm text-gray-300 mt-3">${upgrade.notes || ''}</p>
                                    </div>
                                </div>
                            </div>
                        `}).join('')}
                    `;

                    card.appendChild(cardHeader);
                    card.appendChild(detailsContainer);
                    monkeyGrid.appendChild(card);

                    cardHeader.addEventListener('click', () => {
                        card.classList.toggle('open');
                    });
                });
            }
        };

        const updateView = () => {
            const activeFilter = filterContainer.querySelector('.active').dataset.type;
            const searchTerm = searchInput.value;
            renderMonkeys(activeFilter, searchTerm);
        };

        filterContainer.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                const buttons = filterContainer.querySelectorAll('button');
                buttons.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                updateView();
            }
        });
        
        searchInput.addEventListener('input', updateView);

        // Initial render
        renderMonkeys();
    </script>
</body>
</html>
